name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  setup:
    name: Setup Matrix
    runs-on: ubuntu-latest
    outputs:
      node-versions: ${{ steps.generate-matrix.outputs.node-versions }}
      latest-version: ${{ steps.generate-matrix.outputs.latest-version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Generate Node.js version matrix
        id: generate-matrix
        run: |
          # The floor (first x.y.z in package.json engines.node), the latest 22.x,
          # and the latest version, which .nvmrc names.
          FLOOR=$(node -p "require('./package.json').engines.node.match(/\\d+\\.\\d+\\.\\d+/)[0]")
          NVMRC_VERSION=$(tr -d '[:space:]' < .nvmrc)
          LATEST="${NVMRC_VERSION}.x"
          MATRIX_JSON=$(jq -nc --arg floor "$FLOOR" --arg latest "$LATEST" '[$floor, "22.x", $latest]')
          echo "node-versions=$MATRIX_JSON" >> $GITHUB_OUTPUT
          echo "latest-version=$LATEST" >> $GITHUB_OUTPUT

          echo "Testing on Node.js versions: $MATRIX_JSON"
          echo "Latest version for build: $LATEST"

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: setup

    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ fromJson(needs.setup.outputs.node-versions) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          # Disable cache for matrix builds to avoid conflicts between Node versions
          # Cache is still used in the build job
          # cache: 'npm'

      - name: Clean packages
        run: npm run clean

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Build packages
        run: npm run build

      - name: Smoke-test bin files
        run: npm run validate:bins

      # The serial port tests use socat pseudo-terminal pairs
      - name: Install socat
        run: |
          sudo apt-get update
          sudo apt-get install -y socat

      - name: Run tests
        run: npm run test:ci

      - name: Upload coverage reports
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v5
        if: success()
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  compatibility:
    name: Package Compatibility
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Node.js ${{ needs.setup.outputs.latest-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.setup.outputs.latest-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Validate package exports with publint
        run: npm run validate:publint

      - name: Check TypeScript types with arethetypeswrong
        run: npm run validate:attw

      - name: Check that packages declare what their built files import
        run: npm run validate:dist-imports

      - name: Run compatibility examples
        run: cd examples && ./run-all.sh
