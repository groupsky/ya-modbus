name: Release

on:
  push:
    branches: [main]
  # Manual run on main: publishes versions that a failed run left unpublished
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # For creating tags and pushing commits
  issues: write # For creating GitHub releases
  pull-requests: write # For release notes
  id-token: write # For npm provenance generation

jobs:
  release:
    name: Release Packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    # Don't run on version bump commits to avoid infinite loop
    # Branch protection should require CI to pass before merge
    if: |
      github.ref == 'refs/heads/main' &&
      !startsWith(github.event.head_commit.message, 'chore(release):') &&
      github.event.head_commit.author.username != 'github-actions[bot]'

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # Fetch all history and tags for lerna to detect changes
          fetch-depth: 0
          # Use a token that can trigger workflows
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      # The serial port tests use socat pseudo-terminal pairs
      - name: Install socat
        run: |
          sudo apt-get update
          sudo apt-get install -y socat

      - name: Run tests
        run: npm run test:ci

      - name: Version packages
        id: version
        run: |
          # Capture current tags before versioning
          TAGS_BEFORE=$(git tag | wc -l)

          # Exits 0 when nothing changed or when main moved on (EBEHIND).
          # Any other error, such as a rejected push, stops the job, so a
          # version that is not on main is never published.
          npx lerna version --yes --no-private --sync-workspace-lock

          # Check if any new tags were created
          TAGS_AFTER=$(git tag | wc -l)
          TAGS_CREATED=$((TAGS_AFTER - TAGS_BEFORE))

          if [ $TAGS_CREATED -eq 0 ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No packages to release - no changes detected"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "✅ Created $TAGS_CREATED version tag(s)"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm
        # Runs also when nothing was versioned: from-package publishes every
        # non-private package whose package.json version is not on npm yet,
        # so it also publishes what an earlier failed run left unpublished.
        run: |
          # Publish only what lerna versioned on the latest main. When main
          # moved on (EBEHIND), the run for the newer commit publishes.
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "ℹ️ main moved on, skipping publish in this run"
            exit 0
          fi

          # lerna-lite publish does not check for uncommitted changes
          git diff --exit-code --stat HEAD

          npx lerna publish from-package --yes --no-private || {
            echo "::warning::npm publish failed, retrying once in 30 seconds"
            # Undo the package.json edits that lerna leaves after a failure
            git checkout -- .
            sleep 30
            npx lerna publish from-package --yes --no-private
          }

      - name: No changes detected
        if: steps.version.outputs.has_changes == 'false'
        run: |
          echo "ℹ️ No packages have changes that warrant a release."
          echo ""
          echo "This can happen when:"
          echo "  - Only ignored files changed (tests, docs, config)"
          echo "  - Commits don't match conventional commit format"
          echo "  - Recent release already published the changes"
          echo ""
          echo "See lerna.json ignoreChanges for patterns that skip releases."

      - name: Release summary
        if: steps.version.outputs.has_changes == 'true'
        run: |
          echo "## 🚀 Production Release Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Packages have been published to npm with the \`latest\` dist-tag." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See the [Releases](https://github.com/${{ github.repository }}/releases) page for details." >> $GITHUB_STEP_SUMMARY

  # Container image of the bridge, tagged with the package version. Separate job,
  # so a failure here never fails the npm release.
  image:
    name: Publish Bridge Image
    needs: release
    if: needs.release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # Push to ghcr.io with GITHUB_TOKEN
    env:
      IMAGE: ghcr.io/groupsky/ya-modbus-bridge

    steps:
      - name: Checkout main
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: main

      - name: Read bridge version
        id: version
        run: echo "version=$(jq -r .version packages/mqtt-bridge/package.json)" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if the image exists
        id: exists
        run: |
          if docker buildx imagetools inspect "$IMAGE:${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "ℹ️ $IMAGE:${{ steps.version.outputs.version }} already exists, skipping"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # The npm registry can answer 404 for minutes after a publish. The image
      # installs the bridge and its dependencies from there.
      - name: Wait for the packages on npm
        if: steps.exists.outputs.exists == 'false'
        run: |
          for pkg in mqtt-bridge driver-loader transport driver-types driver-sdk \
            driver-dds024mr driver-dds519mr driver-ex9em driver-or-we-514 driver-or-we-516 \
            driver-sdm630 driver-xymd1; do
            spec="@ya-modbus/$pkg@$(jq -r .version packages/$pkg/package.json)"
            for attempt in $(seq 1 40); do
              npm view "$spec" version >/dev/null 2>&1 && continue 2
              echo "Waiting for $spec (attempt $attempt)"
              sleep 30
            done
            echo "::error::$spec is not on npm"
            exit 1
          done

      - name: Set up QEMU
        if: steps.exists.outputs.exists == 'false'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        if: steps.exists.outputs.exists == 'false'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push
        if: steps.exists.outputs.exists == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: packages/mqtt-bridge/docker
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: BRIDGE_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
